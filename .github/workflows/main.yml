# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

permissions:
  contents: read

# Every run uses the same deliberately isolated Atlas test database. Queue
# runs instead of letting two seeds drop that database underneath each other.
concurrency:
  group: brighteyes-shared-test-database
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Match the runtime selected for production by engines: 22.x.
        node-version: [22.x]

    env:
      # CI runs against the brighteyes_test database (derived below), never live data.
      SECRET: ci-only-test-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run check-format
      - run: npx jest

      - name: Point MONGO_URI at the test database
        env:
          BASE_MONGO_URI: ${{ secrets.MONGO_URI }}
        run: node -e "const uri = require('./scripts/testDbUri')(process.env.BASE_MONGO_URI); require('fs').appendFileSync(process.env.GITHUB_ENV, 'MONGO_URI=' + uri + '\n')"

      - name: Seed the test database
        run: node scripts/seedTestDb.js

      - run: npm run build

      - name: Cypress tests
        # v7 uses the supported Node 24 action runtime; the project commands
        # still run under the Node 22 version configured above.
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm start
          wait-on: http://localhost:3000
          wait-on-timeout: 120
